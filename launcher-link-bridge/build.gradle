plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'com.wibsverse'
version = '1.0.0'
base.archivesName = 'wibsverse-launcher-link-bridge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                wibsverse_launcher_bridge { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

jar {
    manifest.attributes([
        'Specification-Title': 'WibsVerse Launcher Link Bridge',
        'Specification-Vendor': 'WibsVerse',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'WibsVerse',
    ])
    finalizedBy 'reobfJar'
}
