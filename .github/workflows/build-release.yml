name: Build Launcher Releases

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            asset_name: WibsverseLauncher-windows-x64.exe
          - name: macOS Intel
            runner: macos-13
            platform: macos
            asset_name: WibsverseLauncher-mac-x64.zip
          - name: macOS Apple Silicon
            runner: macos-14
            platform: macos
            asset_name: WibsverseLauncher-mac-arm64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: cmd
        run: build_windows.bat

      - name: Prepare Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Copy-Item 'dist\WibsverseLauncher.exe' 'dist\${{ matrix.asset_name }}'

      - name: Build macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
          ditto -c -k --sequesterRsrc --keepParent \
            dist/WibsverseLauncher.app \
            "dist/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes || true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
